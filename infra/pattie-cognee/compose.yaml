# Shared Cognee memory for Pattie. No published ports: only containers on the private `pattie`
# network (the pattie service) reach it, at http://pattie-cognee:8000. Access control is off
# inside, so keep it private. Create the network once: docker network create pattie
#   cd /opt/pattie && docker compose -f infra/pattie-cognee/compose.yaml up -d --build
# Then load the demo persona once:
#   docker exec pattie python -m pattie.memory seed demo/anna_susan_profile.md
services:
  pattie-cognee:
    build:
      context: ../..
      dockerfile: infra/pattie-cognee/Dockerfile
    container_name: pattie-cognee
    restart: unless-stopped
    env_file:
      - /etc/pattie/op-token.env      # OP_SERVICE_ACCOUNT_TOKEN (root-only)
    volumes:
      - cognee-data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - pattie

volumes:
  cognee-data:

networks:
  pattie:
    name: pattie
    external: true

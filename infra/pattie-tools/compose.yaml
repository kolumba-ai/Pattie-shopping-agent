# Runs next to OpenBot on its Docker network. No published ports: only OpenBot can reach it,
# at http://pattie-tools:8765/mcp
#   cd /opt/pattie && docker compose -f infra/pattie-tools/compose.yaml up -d --build
services:
  pattie-tools:
    build:
      context: ../..
      dockerfile: infra/pattie-tools/Dockerfile
    container_name: pattie-tools
    restart: unless-stopped
    env_file:
      - /etc/pattie/op-token.env      # OP_SERVICE_ACCOUNT_TOKEN=...  (root-only, mode 600)
    environment:
      PATTIE_TZ: America/Los_Angeles
      PATTIE_HOME_CITY: San Francisco
    volumes:
      - pattie-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - openbot

volumes:
  pattie-data:

networks:
  openbot:
    name: openbot_default
    external: true
